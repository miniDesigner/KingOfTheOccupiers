<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>占地之王 · 部件格式栅格 v1</title>
<style>
:root{
  --stage:#0B1424; --panel:#16243A; --line:rgba(234,248,255,0.14);
  --ink:#EAF8FF; --ink-2:rgba(234,248,255,0.72); --ink-3:rgba(234,248,255,0.45);
  --card:#EAF8FF; --navy:#2B4A6F; --gold:#FFD23F;
}
*{box-sizing:border-box}
body{
  margin:0;padding:40px 32px 64px;background:var(--stage);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
header{max-width:1440px;margin:0 auto 26px}
h1{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:.5px}
.sub{color:var(--ink-3);font-size:13px;line-height:1.75;margin:0;max-width:900px}
.sub b{color:var(--ink-2);font-weight:500}
.wrap{max-width:1440px;margin:0 auto;display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(520px,1fr))}
.spec{background:rgba(234,248,255,0.03);border:1px solid var(--line);border-radius:14px;padding:18px 20px 16px;overflow:hidden}
.spec h3{margin:0 0 2px;font-size:14px;font-weight:600}
.spec .desc{font-size:11.5px;color:var(--ink-3);margin:0 0 14px;line-height:1.6}
.var{margin-bottom:14px}
.var:last-child{margin-bottom:0}
.vlabel{font-size:10.5px;color:var(--ink-3);margin-bottom:5px;letter-spacing:.3px}
.stagearea{position:relative;background:#0F1B2C;border-radius:8px;border:1px solid rgba(234,248,255,0.08)}
.el{position:absolute;border-radius:4px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.k-card{background:var(--card);color:var(--navy);box-shadow:0 2px 0 rgba(6,14,28,0.55)}
.k-bar{background:rgba(234,248,255,0.13);border:1px solid rgba(234,248,255,0.22);color:#CBD9E6}
.k-slot{background:rgba(43,74,111,0.06);border:1px dashed rgba(43,74,111,0.3);color:rgba(43,74,111,0.5)}
.k-cta{background:var(--gold);color:#4A2A00;font-weight:600;justify-content:center}
.k-ctr{justify-content:center}
.k-sub{background:rgba(234,248,255,0.93);color:var(--navy);justify-content:center;font-weight:600}
.k-dis{background:rgba(255,255,255,0.12);color:rgba(234,248,255,0.4);justify-content:center;border:1px solid rgba(234,248,255,0.14)}
.k-text{background:transparent;color:var(--navy);align-items:center}
.k-dim{color:rgba(43,74,111,0.55)}
.k-light{color:#EAF8FF}
.k-fill{background:#FF8C42}
.k-track{background:rgba(234,248,255,0.16);border-radius:99px;overflow:hidden}
.k-dot{background:#EAF8FF;border-radius:50%}
.k-tag{background:#FFD23F;color:#4A2A00;font-weight:600;justify-content:center;border-radius:3px}
.k-edge{background:#FF8C42}
.k-base{background:rgba(22,48,79,0.55)}
.dims{margin-top:12px;font-size:11px;color:var(--ink-3);line-height:1.85;font-variant-numeric:tabular-nums}
.dims b{color:var(--ink-2);font-weight:500}
.foot{max-width:1440px;margin:40px auto 0;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);line-height:1.8}
</style>
</head>

    所有数值为 430 屏设计值，实施时落在组件方法内，不在各屏重复写。
  </p>
</header>

const wrap = document.getElementById('wrap');
wrap.innerHTML = specs.map(s => {
  const z = s.z;
  const W = Math.round(s.w * z);
  const vars = s.variants.map(v => {
    const H = Math.round((v.h || s.h) * z);
    const els = v.parts.map(p => {
      const fs = p.s ? (p.s * z).toFixed(1) + 'px' : '0';
      const style = `left:${(p.x*z).toFixed(1)}px;top:${(p.y*z).toFixed(1)}px;width:${(p.w*z).toFixed(1)}px;height:${(p.h*z).toFixed(1)}px;font-size:${fs}`;
      const pad = 'padding:0 6px;';
      return `<div class="el ${p.k.split(' ').map(c=>'k-'+c).join(' ')}" style="${style};${pad}">${p.t || ''}</div>`;
    }).join('');
    return `<div class="var"><div class="vlabel">${v.label}</div><div class="stagearea" style="width:${W}px;height:${H}px">${els}</div></div>`;
  }).join('');
  return `<section class="spec">
    <h3>${s.name} <span style="float:right;font-size:10.5px;color:var(--ink-3);font-weight:400">×${z}</span></h3>
    <p class="desc">${s.desc}</p>
    ${vars}
    <div class="dims">${s.dims}</div>
  </section>`;
}).join('');
